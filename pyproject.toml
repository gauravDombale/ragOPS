[project]
name = "rag-observability"
version = "1.0.0"
description = "Production-grade RAG monitoring and observability"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pyright]
include = ["src", "evals", "load_tests"]
typeCheckingMode = "basic"
reportMissingImports = false
